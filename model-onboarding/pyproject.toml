[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-onboarding"
version = "1.0.0"
description = "Automated Spreadsheet Onboarding Module (Hygiene Go/No-Go Gate, Managed Agent Sandbox Worker, Git PR Publisher & Deterministic Deployer)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "google-auth>=2.28.0",
    "google-cloud-bigquery>=3.17.0",
    "google-cloud-storage>=2.14.0",
    "openpyxl>=3.1.2",
    "pyyaml>=6.0",
]

[project.scripts]
onboard = "model_onboarding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../portfolio-assessment/src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 108
target-version = "py311"
