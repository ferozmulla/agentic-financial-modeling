[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latinlr202409-bq-twin"
version = "1.0.0"
description = "GCP BigQuery Digital Twin, 4-Ws Governance, ARIMA_PLUS BQML and AST Solver for Latinlr202409 Model"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn>=0.22.0",
    "openpyxl>=3.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "google-cloud-bigquery>=3.10.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]
