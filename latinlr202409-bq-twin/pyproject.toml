[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latinlr202409-bq-twin"
version = "1.0.0"
description = "Isolated BigQuery Digital Twin, Circular Equilibrium Solver, ARIMA_PLUS BQML, and Remote MCP Server for Latinlr202409 (Latin America Refining)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "google-cloud-bigquery>=3.20.0",
  "google-cloud-storage>=2.16.0",
  "openpyxl>=3.1.2",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "pyyaml>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
