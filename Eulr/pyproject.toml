[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eulr-commodity-modeling-platform"
version = "2.0.0"
description = "European Long-Range Crude & Refined Products Equilibrium Model (Eulr202409) — Google Sheets & Google Cloud Platform"
readme = "docs/01_PRD_Eulr_Google_Sheets.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "openpyxl>=3.1.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.27",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "google-auth>=2.28.0",
    "google-api-python-client>=2.120.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-bigquery>=3.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 108
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
